name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint:md

  mermaid-render:
    name: Mermaid Diagram Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate Mermaid diagrams
        run: |
          npx --yes @mermaid-js/mermaid-cli@10.9.1 --version
          npm run render:mermaid

  structure-validate:
    name: Repo Structure Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python scripts/validate_structure.py

  terraform:
    name: "Terraform (${{ matrix.env }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - local
          - dev
          - stg
          - prd
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
      - name: Setup tfvars
        run: |
          cp "src/terraform/environments/${{ matrix.env }}/terraform.tfvars.example" \
             "src/terraform/environments/${{ matrix.env }}/terraform.auto.tfvars"
          if [ -f "src/terraform/environments/${{ matrix.env }}/backend.hcl.example" ]; then
            cp "src/terraform/environments/${{ matrix.env }}/backend.hcl.example" \
               "src/terraform/environments/${{ matrix.env }}/backend.hcl"
          fi
      - name: terraform fmt
        run: terraform fmt -check -recursive src/terraform
      - name: terraform init
        run: |
          cd "src/terraform/environments/${{ matrix.env }}"
          terraform init -backend=false -input=false -no-color
      - name: terraform validate
        run: |
          cd "src/terraform/environments/${{ matrix.env }}"
          terraform validate -no-color

  terraform-test:
    name: Terraform Tests (modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
      - name: Test Snowflake module
        run: |
          cd src/terraform/modules/snowflake
          terraform init -no-color
          terraform test -no-color
      - name: Test S3 module
        run: |
          cd src/terraform/modules/s3
          terraform init -no-color
          terraform test -no-color

  dbt-build-local:
    name: "dbt build (local / DuckDB)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dbt + DuckDB + pyarrow
        run: |
          python -m pip install --upgrade pip
          pip install "dbt-core~=1.11.0" "dbt-duckdb>=1.9.0,<2.0.0" "pyarrow>=15.0.0"
      - name: Generate Bronze fixtures
        run: python scripts/generate_bronze.py --rows-pedidos 2000 --rows-clientes 500
      - name: Setup dbt profile
        run: |
          mkdir -p ~/.dbt
          cp src/dbt/profiles.yml.example ~/.dbt/profiles.yml
      - name: dbt deps
        run: cd src/dbt && dbt deps --no-version-check
      - name: dbt build (local)
        run: cd src/dbt && dbt build --target local --no-version-check
        env:
          DBT_DUCKDB_PATH: /tmp/lakehouse.duckdb
      - name: dbt source freshness (local)
        # dbt source freshness is informational on DuckDB local (no loaded_at_field);
        # the hard gate is the file-mtime check below. Strict on Snowflake targets.
        run: cd src/dbt && dbt source freshness --target local --no-version-check || true
        env:
          DBT_DUCKDB_PATH: /tmp/lakehouse.duckdb
      - name: Bronze freshness gate (file mtime)
        run: python scripts/check_bronze_freshness.py --warn-hours 24 --error-hours 48
      - name: Upload DuckDB artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lakehouse-duckdb
          path: /tmp/lakehouse.duckdb
          retention-days: 7
          if-no-files-found: ignore
      - name: Generate health report
        if: always()
        run: python scripts/generate_health_report.py --run-results src/dbt/target/run_results.json --out /tmp/health.md
        env:
          DBT_DUCKDB_PATH: /tmp/lakehouse.duckdb
      - name: Upload health report artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lakehouse-health
          path: /tmp/health.md
          retention-days: 7
          if-no-files-found: ignore

  python-lint:
    name: Python Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install "ruff==0.15.12" "mypy==1.19.1" types-PyYAML
      - run: ruff check src/streaming src/airflow scripts
      - run: mypy --ignore-missing-imports src/streaming src/airflow scripts

  all-checks-passed:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs:
      - markdown-lint
      - mermaid-render
      - structure-validate
      - terraform
      - terraform-test
      - dbt-build-local
      - python-lint
    if: always()
    steps:
      - name: Report check results
        run: |
          echo "=== Core Checks (required) ==="
          for check in "markdown-lint" "structure-validate" "terraform" "terraform-test" "dbt-build-local"; do
            result_var="NEEDS_${check//-/_}_RESULT"
            result="${!result_var}"
            echo "  $check: $result"
          done
          echo ""
          echo "=== Optional Checks (continue-on-error) ==="
          for check in "mermaid-render" "python-lint"; do
            result_var="NEEDS_${check//-/_}_RESULT"
            result="${!result_var}"
            echo "  $check: $result"
          done
          echo ""
          if [ "$NEEDS_MARKDOWN_LINT_RESULT" != "success" ] || [ "$NEEDS_STRUCTURE_VALIDATE_RESULT" != "success" ] || [ "$NEEDS_TERRAFORM_RESULT" != "success" ] || [ "$NEEDS_TERRAFORM_TEST_RESULT" != "success" ] || [ "$NEEDS_DBT_BUILD_LOCAL_RESULT" != "success" ]; then
            echo "Required checks failed."
            exit 1
          fi
          echo "All required checks passed."
        env:
          NEEDS_MARKDOWN_LINT_RESULT: ${{ needs.markdown-lint.result }}
          NEEDS_MERMAID_RENDER_RESULT: ${{ needs.mermaid-render.result }}
          NEEDS_STRUCTURE_VALIDATE_RESULT: ${{ needs.structure-validate.result }}
          NEEDS_TERRAFORM_RESULT: ${{ needs.terraform.result }}
          NEEDS_TERRAFORM_TEST_RESULT: ${{ needs.terraform-test.result }}
          NEEDS_DBT_BUILD_LOCAL_RESULT: ${{ needs.dbt-build-local.result }}
          NEEDS_PYTHON_LINT_RESULT: ${{ needs.python-lint.result }}

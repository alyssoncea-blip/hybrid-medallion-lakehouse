name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci --no-audit --no-fund
      - run: npm run lint:md

  terraform:
    name: "Terraform (${{ matrix.env }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - local
          - dev
          - stg
          - prd
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
      - name: terraform fmt
        run: terraform fmt -check -recursive src/terraform
      - name: terraform init
        run: |
          cd "src/terraform/environments/${{ matrix.env }}"
          terraform init -backend=false -input=false -no-color
      - name: terraform validate
        run: |
          cd "src/terraform/environments/${{ matrix.env }}"
          terraform validate -no-color
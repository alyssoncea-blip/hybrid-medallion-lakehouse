name: Pre-commit (lightweight)

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-commit hooks (lightweight)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Markdown lint
        run: |
          npm ci --no-audit --no-fund
          npm run lint:md

      - name: Terraform fmt
        run: terraform fmt -check -recursive src/terraform

      - name: No secrets
        run: |
          if grep -rE 'BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY' . --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=target; then
            echo "FAIL: private key committed"
            exit 1
          fi
          echo "No secrets detected"
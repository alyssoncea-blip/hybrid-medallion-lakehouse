version: "2"
linters:
  default: standard
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - makezero
    - nilerr
    - prealloc
    - sqlclosecheck
  disable:
    - cyclop
    - dupl
    - funlen
    - gocognit
    - gocyclo
    - godot
    - gosec
    - lll
    - nlreturn
    - testpackage
    - wsl
  settings:
    gocritic:
      enabled-tags: [diagnostic, performance, style]
    revive:
      rules: [var-naming, package-comments, exported]
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck, gosec, dupl]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["dbt_packages", "target", "logs"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF",
    "PT", "RET", "TID", "ARG", "PL", "DTZ", "BLE", "S110",
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function call in default argument
    "PLR0913", # too many arguments
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "ARG", "PLR2004"]
"**/snapshots/**" = ["ARG001"]
"scripts/*" = ["T201", "INP001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

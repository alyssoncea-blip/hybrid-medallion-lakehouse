version: 2

sources:
  - name: bronze_raw
    description: >
      Camada Bronze — landing zone raw. Lê Parquet/CSV locais no target `local`
      (DuckDB) ou external tables no Snowflake (targets dev/stg/prd).
    config:
      tags: ["bronze", "raw"]
    # Gap known: the FileQueue streaming pipeline (src/streaming) lands events in
    # data/bronze/streaming/event_date=*/event_hour=* — the bronze_source() macro
    # globs <table>/*.parquet and does not match that Hive layout, and
    # generate_bronze.py does not emit streaming fixtures. Streaming output is
    # landing-only 🔭 (not consumed by dbt) until a connector or macro change is
    # chosen. See src/streaming/README.md.
    tables:
      - name: pedidos_vendas
        description: Pedidos de vendas extraídos do SAP SD/Oracle OMS.
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 48, period: hour}
        columns:
          - name: pedido_id
            description: Identificador do pedido.
            data_type: varchar
          - name: cliente_id
            description: FK para o cliente.
            data_type: varchar
          - name: data_pedido
            description: Data do pedido.
            data_type: date
          - name: valor_total
            data_type: numeric(18,2)
          - name: status
            data_type: varchar
          - name: canal_venda
            data_type: varchar
          - name: vendedor_id
            data_type: varchar

      - name: clientes_cadastro
        description: Cadastro de clientes vindo do CRM.
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 48, period: hour}
        columns:
          - name: cliente_id
            description: Identificador do cliente (PK).
            data_type: varchar
          - name: nome
            data_type: varchar
          - name: cpf
            description: CPF (mascarado in place via mask_cpf; LGPD).
            data_type: varchar
          - name: email
            data_type: varchar
          - name: data_cadastro
            data_type: date

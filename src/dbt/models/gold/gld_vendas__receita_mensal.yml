version: 2

models:
  - name: gld_vendas__receita_mensal
    description: >
      Métrica certificada de receita líquida por mês, por canal e por cliente.
      Camada Gold — consumida por BI, ML e Reverse-ETL.
    columns:
      - name: ano_mes
        description: Mês de competência (YYYY-MM).
        data_type: varchar
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: "^[0-9]{4}-[0-9]{2}$"
      - name: canal_venda
        description: Canal de venda.
        data_type: varchar
        tests:
          - not_null
      - name: cliente_sk
        description: SK do cliente.
        data_type: varchar
        tests:
          - not_null
      - name: receita_bruta
        description: Soma de valor_total dos pedidos não cancelados.
        data_type: numeric(18,2)
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: receita_liquida
        description: receita_bruta − cancelamentos − devoluções.
        data_type: numeric(18,2)
        tests:
          - not_null
      - name: cancelamentos
        description: Soma de valor_total dos pedidos cancelados.
        data_type: numeric(18,2)
      - name: devolucoes
        description: Soma de valor_total dos pedidos devolvidos.
        data_type: numeric(18,2)
      - name: qtd_pedidos
        description: Quantidade de pedidos no mês/canal/cliente.
        data_type: integer
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
      - name: _gold_loaded_at
        description: Timestamp de carga da camada Gold.
        data_type: timestamp
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - ano_mes
              - canal_venda
              - cliente_sk

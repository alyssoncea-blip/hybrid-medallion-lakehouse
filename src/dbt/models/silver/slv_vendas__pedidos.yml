version: 2

models:
  - name: slv_vendas__pedidos
    description: >
      Pedidos de venda deduplicados, com SCD2 e chaves surrogadas.
      Camada Silver — fonte da verdade para o domínio de Vendas.
    columns:
      - name: pedido_sk
        description: Surrogate key (hash determinístico) do pedido.
        data_type: varchar
        tests:
          - not_null
          - unique
      - name: pedido_id
        description: ID natural do pedido vindo da fonte.
        data_type: varchar
        tests:
          - not_null
      - name: cliente_sk
        description: SK do cliente (FK para slv_cliente__cadastro).
        data_type: varchar
        tests:
          - not_null
      - name: data_pedido
        description: Data de criação do pedido.
        data_type: date
        tests:
          - not_null
      - name: valor_total
        description: Valor total do pedido em BRL.
        data_type: numeric(18,2)
        tests:
          - not_null
      - name: status
        description: Status do pedido no fluxo de vendas.
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ABERTO', 'PAGO', 'FATURADO', 'CANCELADO', 'DEVOLVIDO']
      - name: vendedor_id
        description: Identificador do vendedor.
        data_type: varchar
      - name: canal_venda
        description: Canal de venda do pedido.
        data_type: varchar
      - name: _dbt_valid_from
        description: Dedup diario (nao e SCD2; historico real em snapshots/slv_clientes_snapshot).
        data_type: timestamp
        tests:
          - not_null
      - name: _dbt_valid_to
        description: Dedup diario (nao e SCD2; historico real em snapshots/slv_clientes_snapshot). NULL = ativo.
        data_type: timestamp
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - pedido_sk
              - _dbt_valid_from
